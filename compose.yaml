name: ged

x-backend: &backend
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - ./backend:/var/www/html
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ged
    DB_USERNAME: ged
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    APP_URL: http://localhost:${APP_PORT:-8000}
    FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-5173},localhost:${APP_PORT:-8000}
  depends_on:
    postgres:
      condition: service_healthy

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:${APP_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    <<: *backend
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ged
      POSTGRES_USER: ged
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-testing.sql:/docker-entrypoint-initdb.d/01-testing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ged -d ged"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  frontend_node_modules:
